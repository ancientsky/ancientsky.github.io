<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中聯油脂受影響產品快查</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .scanner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .scan-box {
            width: 80%;
            height: 40%;
            border: 3px solid #ef4444;
            border-radius: 16px;
            position: relative;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
        }

        .scan-line {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
            position: absolute;
            top: 0;
            animation: scan 2s linear infinite;
            box-shadow: 0 0 10px #ef4444;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ef4444;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        
        video {
            object-fit: cover;
        }

        .result-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="bg-red-600 text-white p-4 sticky top-0 z-20 shadow-md">
        <h1 class="text-xl font-bold text-center flex items-center justify-center gap-2">
            <i class="fa-solid fa-shield-virus"></i>食安預警快查
        </h1>
        <p class="text-xs text-center text-red-100 mt-1">中聯油脂受影響產品 • 401項</p>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto hide-scroll pb-20 relative bg-gray-50" id="main-content">
        
        <!-- Tab 1: 拍照掃描 -->
        <div id="tab-scan" class="h-full flex flex-col">
            <div class="relative flex-1 bg-black overflow-hidden" style="height: 60vh;">
                <video id="camera-feed" class="w-full h-full absolute inset-0 z-0" autoplay playsinline muted></video>
                <div class="scanner-overlay z-10">
                    <div class="scan-box">
                        <div class="scan-line" id="scan-line" style="display: none;"></div>
                        <div class="absolute -top-2 -left-2 w-6 h-6 border-t-4 border-l-4 border-red-500 rounded-tl-xl"></div>
                        <div class="absolute -top-2 -right-2 w-6 h-6 border-t-4 border-r-4 border-red-500 rounded-tr-xl"></div>
                        <div class="absolute -bottom-2 -left-2 w-6 h-6 border-b-4 border-l-4 border-red-500 rounded-bl-xl"></div>
                        <div class="absolute -bottom-2 -right-2 w-6 h-6 border-b-4 border-r-4 border-red-500 rounded-br-xl"></div>
                    </div>
                </div>
                
                <div id="camera-status" class="absolute inset-0 bg-black/80 z-20 flex flex-col items-center justify-center text-white px-6 text-center">
                    <i class="fa-solid fa-camera text-5xl mb-6 text-gray-300"></i>
                    <p class="mb-6 text-lg">請允許相機權限<br>掃描產品包裝文字</p>
                    <button id="btn-start-camera" class="bg-red-500 hover:bg-red-600 px-8 py-3 rounded-2xl font-semibold text-lg shadow-lg transition">
                        開啟相機
                    </button>
                    <p id="camera-hint" class="text-xs text-red-200 mt-8 max-w-[260px]">需在 HTTPS 或 localhost 環境下使用</p>
                </div>
                <canvas id="canvas-capture" class="hidden"></canvas>
            </div>

            <div class="bg-white p-4 rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.08)] -mt-4 relative z-30 flex-1">
                <p class="text-sm text-gray-500 text-center mb-4">對準產品名稱或廠商，點擊下方拍照</p>
                <button id="btn-capture" disabled class="w-full bg-red-600 disabled:bg-gray-300 text-white py-4 rounded-2xl font-bold text-lg shadow-md hover:bg-red-700 transition flex items-center justify-center gap-3">
                    <i class="fa-solid fa-camera"></i> 拍照辨識
                </button>
                
                <div id="ocr-status" class="mt-4 hidden p-4 rounded-2xl bg-gray-100 flex items-center gap-3">
                    <div class="loader"></div>
                    <span id="ocr-text" class="text-sm text-gray-700 font-medium flex-1">正在初始化辨識引擎...</span>
                </div>
            </div>
        </div>

        <!-- Tab 2: 手動搜尋 -->
        <div id="tab-search" class="hidden h-full flex flex-col p-4">
            <div class="relative mb-4">
                <input type="text" id="search-input" placeholder="輸入產品名稱或廠商..." 
                       class="w-full pl-12 pr-4 py-4 rounded-2xl border-2 border-gray-200 focus:border-red-500 focus:outline-none text-base shadow-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-4 text-gray-400 text-xl"></i>
            </div>
            
            <div class="flex items-center justify-between text-sm text-gray-500 mb-3">
                <span>搜尋結果 <span id="search-count" class="font-bold text-red-500">0</span> 筆</span>
            </div>

            <div id="search-results" class="flex-1 overflow-y-auto space-y-3">
                <!-- dynamic -->
            </div>
        </div>

        <!-- Tab 3: 完整清單 -->
        <div id="tab-list" class="hidden h-full flex flex-col bg-white">
            <div class="p-4 bg-gray-100 text-xs text-gray-500 border-b sticky top-0 z-10">
                總計 401 項預防性下架產品 (更新日期: 115年7月8日)
            </div>
            <div id="full-list-container" class="flex-1 overflow-y-auto p-4 space-y-3 pb-20">
                <!-- dynamic -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full max-w-[480px] z-30">
        <div class="flex justify-around items-center h-16">
            <button onclick="switchTab('scan')" id="nav-scan" class="flex-1 flex flex-col items-center justify-center text-red-600 gap-1">
                <i class="fa-solid fa-camera text-2xl"></i>
                <span class="text-[10px] font-bold">拍照</span>
            </button>
            <button onclick="switchTab('search')" id="nav-search" class="flex-1 flex flex-col items-center justify-center text-gray-400 gap-1 hover:text-red-500">
                <i class="fa-solid fa-magnifying-glass text-2xl"></i>
                <span class="text-[10px] font-bold">關鍵字</span>
            </button>
            <button onclick="switchTab('list')" id="nav-list" class="flex-1 flex flex-col items-center justify-center text-gray-400 gap-1 hover:text-red-500">
                <i class="fa-solid fa-list-check text-2xl"></i>
                <span class="text-[10px] font-bold">完整清單</span>
            </button>
        </div>
    </nav>

    <!-- Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-[380px] shadow-2xl" id="modal-content">
            <div id="modal-icon" class="w-20 h-20 mx-auto rounded-2xl flex items-center justify-center text-4xl mb-5"></div>
            <h2 id="modal-title" class="text-2xl font-bold text-center mb-3"></h2>
            <p id="modal-desc" class="text-center text-gray-600 mb-6 text-[15px]"></p>
            
            <div id="modal-matches" class="max-h-60 overflow-y-auto mb-6 space-y-3 hide-scroll"></div>

            <button onclick="closeModal()" class="w-full bg-gray-900 hover:bg-black text-white py-4 rounded-2xl font-bold text-lg transition">
                我知道了
            </button>
        </div>
    </div>
</div>

<script>
    // ==================== 資料庫 ====================
    const rawDataString = `...（您的原始資料保持不變，我這裡省略以節省空間，您可直接複製原本的 rawDataString）...`;
    // 請將您原本完整的 rawDataString 貼回這裡

    const productDatabase = [];
    rawDataString.trim().split('\n').forEach(line => {
        if (line.startsWith('|')) {
            const parts = line.split('|').map(p => p.trim()).filter(p => p);
            if (parts.length >= 3) {
                productDatabase.push({
                    company: parts[0],
                    name: parts[1],
                    expiry: parts[2]
                });
            }
        }
    });

    // ==================== 渲染完整清單 ====================
    function renderFullList() {
        const container = document.getElementById('full-list-container');
        container.innerHTML = '';
        productDatabase.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = "result-card bg-white p-4 rounded-2xl shadow-sm border border-gray-100";
            card.innerHTML = `
                <div class="text-[10px] text-gray-400">#${index + 1} • ${item.company}</div>
                <div class="font-bold text-gray-800 mt-1 text-[17px] leading-tight">${item.name}</div>
                <div class="text-xs mt-3 inline-flex items-center gap-1.5 bg-red-50 text-red-600 px-3 py-1 rounded-xl">
                    <i class="fa-regular fa-clock"></i> ${item.expiry}
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ==================== Tesseract 初始化 ====================
    let tesseractWorker = null;
    let tesseractReady = false;

    async function initTesseract() {
        const status = document.getElementById('ocr-status');
        const textEl = document.getElementById('ocr-text');
        status.classList.remove('hidden');
        
        try {
            textEl.textContent = "載入繁體中文辨識模型...";
            tesseractWorker = await Tesseract.createWorker('chi_tra', 1, {
                logger: m => console.log(m)
            });
            tesseractReady = true;
            textEl.textContent = "✅ 辨識引擎準備完成";
            setTimeout(() => status.classList.add('hidden'), 1500);
        } catch (e) {
            console.error(e);
            textEl.textContent = "❌ 引擎載入失敗，請用手動搜尋";
        }
    }

    // ==================== 相機功能 ====================
    let currentStream = null;

    async function startCamera() {
        const video = document.getElementById('camera-feed');
        const statusDiv = document.getElementById('camera-status');
        const btnCapture = document.getElementById('btn-capture');

        if (!navigator.mediaDevices?.getUserMedia) {
            alert("您的瀏覽器不支援相機功能，請使用最新版 Chrome / Edge");
            return;
        }

        try {
            currentStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = currentStream;
            statusDiv.classList.add('hidden');
            document.getElementById('scan-line').style.display = 'block';

            if (tesseractReady) btnCapture.disabled = false;
        } catch (err) {
            console.error(err);
            let msg = "無法開啟相機";
            if (err.name === "NotAllowedError") msg = "請允許相機權限";
            if (err.name === "NotFoundError") msg = "找不到相機裝置";
            
            statusDiv.innerHTML = `
                <i class="fa-solid fa-triangle-exclamation text-5xl mb-6 text-red-400"></i>
                <p class="text-red-400 font-bold mb-2">${msg}</p>
                <p class="text-sm">請確認已在 HTTPS 或 localhost 環境下使用</p>
            `;
        }
    }

    // ==================== 拍照與 OCR ====================
    async function captureAndOCR() {
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('canvas-capture');
        const btn = document.getElementById('btn-capture');
        const status = document.getElementById('ocr-status');
        const textEl = document.getElementById('ocr-text');

        if (!tesseractReady || !currentStream) return;

        btn.disabled = true;
        document.getElementById('scan-line').style.animationDuration = '0.6s';
        status.classList.remove('hidden');
        textEl.textContent = "正在辨識文字...";

        try {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            const imageData = canvas.toDataURL('image/jpeg', 0.85);
            const { data: { text } } = await tesseractWorker.recognize(imageData);
            
            console.log("OCR 結果:", text);
            analyzeOCRResult(text.trim());
        } catch (err) {
            console.error(err);
            showModal("辨識失敗", "請確保光線充足並對準文字後重試", "warning");
        } finally {
            btn.disabled = false;
            document.getElementById('scan-line').style.animationDuration = '2s';
            status.classList.add('hidden');
        }
    }

    function analyzeOCRResult(scannedText) {
        if (!scannedText) {
            showModal("未偵測到文字", "請對準包裝文字並確保光線良好", "warning");
            return;
        }

        const cleanText = scannedText.replace(/\s+/g, '').toLowerCase();
        const matches = [];

        productDatabase.forEach(item => {
            const cName = item.name.replace(/\s+/g, '').toLowerCase();
            const cComp = item.company.replace(/\s+/g, '').toLowerCase();
            
            if (cName.length > 1 && (cleanText.includes(cName) || cName.includes(cleanText)) ||
                cComp.length > 2 && cleanText.includes(cComp)) {
                matches.push(item);
            }
        });

        if (matches.length > 0) {
            showModal("⚠️ 發現疑似受影響產品", 
                `請立即確認並停用！<br><span class="text-xs text-gray-500">辨識文字：${scannedText.substring(0, 40)}...</span>`, 
                "danger", matches);
        } else {
            showModal("✅ 目前安全", 
                `未在清單中找到相符產品<br><span class="text-xs text-gray-500">仍建議交叉比對完整清單</span>`, 
                "success");
        }
    }

    // ==================== Modal ====================
    function showModal(title, desc, type, matches = []) {
        const modal = document.getElementById('result-modal');
        const content = document.getElementById('modal-content');
        const iconDiv = document.getElementById('modal-icon');
        const titleEl = document.getElementById('modal-title');
        const descEl = document.getElementById('modal-desc');
        const matchesDiv = document.getElementById('modal-matches');

        titleEl.textContent = title;
        descEl.innerHTML = desc;
        matchesDiv.innerHTML = '';
        matchesDiv.classList.toggle('hidden', matches.length === 0);

        if (type === 'danger') {
            iconDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-white"></i>`;
            iconDiv.className = "w-20 h-20 mx-auto rounded-2xl flex items-center justify-center text-4xl mb-5 bg-red-500";
            matches.forEach(m => {
                const d = document.createElement('div');
                d.className = "bg-red-50 border border-red-200 p-3 rounded-2xl";
                d.innerHTML = `<div class="text-xs text-red-500">${m.company}</div><div class="font-semibold">${m.name}</div>`;
                matchesDiv.appendChild(d);
            });
        } else if (type === 'success') {
            iconDiv.innerHTML = `<i class="fa-solid fa-check text-white"></i>`;
            iconDiv.className = "w-20 h-20 mx-auto rounded-2xl flex items-center justify-center text-4xl mb-5 bg-green-500";
        } else {
            iconDiv.innerHTML = `<i class="fa-solid fa-circle-info text-white"></i>`;
            iconDiv.className = "w-20 h-20 mx-auto rounded-2xl flex items-center justify-center text-4xl mb-5 bg-amber-500";
        }

        modal.classList.remove('hidden');
        setTimeout(() => content.style.transform = 'scale(1)', 10);
    }

    function closeModal() {
        const modal = document.getElementById('result-modal');
        const content = document.getElementById('modal-content');
        content.style.transform = 'scale(0.95)';
        setTimeout(() => modal.classList.add('hidden'), 200);
    }

    // ==================== 手動搜尋 ====================
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const searchCount = document.getElementById('search-count');

    searchInput.addEventListener('input', () => {
        const kw = searchInput.value.trim().toLowerCase();
        searchResults.innerHTML = '';

        if (!kw) {
            searchCount.textContent = '0';
            searchResults.innerHTML = `<div class="text-center text-gray-400 py-12"><i class="fa-solid fa-box-open text-5xl mb-4"></i><p>輸入關鍵字查詢</p></div>`;
            return;
        }

        const filtered = productDatabase.filter(item => 
            item.name.toLowerCase().includes(kw) || item.company.toLowerCase().includes(kw)
        );

        searchCount.textContent = filtered.length;

        if (filtered.length === 0) {
            searchResults.innerHTML = `<div class="text-center text-green-600 py-12"><i class="fa-solid fa-circle-check text-5xl mb-4"></i><p class="font-bold">未找到相關產品<br>安全！</p></div>`;
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = "result-card bg-red-50 border-l-4 border-red-500 p-4 rounded-r-2xl";
            div.innerHTML = `
                <div class="text-xs text-red-500">${item.company}</div>
                <div class="font-bold text-lg mt-1">${item.name}</div>
                <div class="text-xs mt-3 text-gray-600">${item.expiry}</div>
            `;
            searchResults.appendChild(div);
        });
    });

    // ==================== Tab 切換 ====================
    function switchTab(tab) {
        document.querySelectorAll('#main-content > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(`tab-${tab}`).classList.remove('hidden');

        document.querySelectorAll('nav button').forEach(btn => {
            btn.classList.remove('text-red-600');
            btn.classList.add('text-gray-400');
        });
        document.getElementById(`nav-${tab}`).classList.add('text-red-600');

        if (tab !== 'scan' && currentStream) {
            currentStream.getTracks().forEach(t => t.stop());
            currentStream = null;
        }
    }

    // ==================== 初始化 ====================
    window.onload = () => {
        renderFullList();
        
        // 背景載入 Tesseract
        initTesseract();

        // 相機按鈕
        document.getElementById('btn-start-camera').addEventListener('click', startCamera);
        document.getElementById('btn-capture').addEventListener('click', captureAndOCR);

        // 預設開啟拍照頁
        switchTab('scan');
    };
</script>
</body>
</html>
