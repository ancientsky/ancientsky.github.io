<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中聯油脂受影響產品快查</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 載入 Tesseract.js 用於影像文字辨識 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        /* 手機模擬容器 */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 相機掃描框 UI */
        .scanner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .scan-box {
            width: 80%;
            height: 40%;
            border: 2px solid #ef4444;
            border-radius: 12px;
            position: relative;
            background: rgba(0,0,0,0.2);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: #ef4444;
            position: absolute;
            top: 0;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ef4444;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        
        /* 避免影片出現控制列 */
        video {
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="bg-red-600 text-white p-4 sticky top-0 z-20 shadow-md">
        <h1 class="text-xl font-bold text-center"><i class="fa-solid fa-shield-virus mr-2"></i>食安預警快查</h1>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto hide-scroll pb-20 relative bg-gray-50" id="main-content">
        
        <!-- Tab 1: 拍照掃描 -->
        <div id="tab-scan" class="h-full flex flex-col">
            <div class="relative shrink-0 bg-black overflow-hidden flex flex-col justify-center items-center h-[55vh] min-h-[320px]">

                <div class="scanner-overlay z-10">
                    <div class="scan-box">
                        <div class="scan-line" id="scan-line" style="display: none;"></div>
                        <div class="absolute -top-1 -left-1 w-4 h-4 border-t-4 border-l-4 border-red-500"></div>
                        <div class="absolute -top-1 -right-1 w-4 h-4 border-t-4 border-r-4 border-red-500"></div>
                        <div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-4 border-l-4 border-red-500"></div>
                        <div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-4 border-r-4 border-red-500"></div>
                    </div>
                </div>
                <!-- 相機狀態遮罩 -->
                <div id="camera-status" class="absolute inset-0 bg-black/80 z-20 flex flex-col items-center justify-center text-white px-6 text-center">
                    <i class="fa-solid fa-camera text-4xl mb-4 text-gray-400"></i>
                    <p class="mb-4">請允許相機權限以掃描產品包裝</p>
                    <button id="btn-start-camera" class="bg-red-500 hover:bg-red-600 px-6 py-2 rounded-full font-semibold transition shadow-lg">
                        開啟相機

                </div>
                <canvas id="canvas-capture" class="hidden"></canvas>
            </div>

            <!-- 控制面板 -->
            <div class="bg-white p-4 rounded-t-2xl shadow-[0_-4px_15px_rgba(0,0,0,0.05)] -mt-4 relative z-30 flex-1">

                <button id="btn-capture" disabled class="w-full bg-red-600 disabled:bg-gray-300 text-white py-4 rounded-xl font-bold text-lg shadow-md hover:bg-red-700 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-expand"></i> 拍照辨識

                <!-- 辨識進度與結果 -->

                    <div class="loader" id="ocr-loader"></div>
                    <span id="ocr-text" class="text-sm text-gray-700 font-medium">初始化文字辨識引擎中...</span>
                </div>
            </div>
        </div>

        <!-- Tab 2: 手動搜尋 -->
        <div id="tab-search" class="hidden h-full flex flex-col p-4">
            <div class="relative">
                <input type="text" id="search-input" placeholder="輸入產品名稱或業者關鍵字..." class="w-full pl-10 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-red-500 focus:outline-none transition text-lg shadow-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
            </div>
            
            <div class="mt-4 flex items-center justify-between text-sm text-gray-500">
                <span>搜尋結果 <span id="search-count" class="font-bold text-red-500">0</span> 筆</span>
            </div>

            <div id="search-results" class="mt-4 flex-1 overflow-y-auto space-y-3 pb-6">
                <!-- 搜尋結果將動態插入此處 -->
                <div class="text-center text-gray-400 mt-10">
                    <i class="fa-solid fa-box-open text-4xl mb-2"></i>
                    <p>請輸入關鍵字開始查詢</p>
                </div>
            </div>
        </div>

        <!-- Tab 3: 完整清單 -->

            <div class="p-3 bg-gray-100 text-xs text-gray-500 text-center border-b">
                總計 401 項預防性下架產品 (更新日期: 115年7月8日)
            </div>
            <div id="full-list-container" class="flex-1 overflow-y-auto p-4 space-y-3 pb-6">
                <!-- 完整列表將動態插入此處 -->
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full max-w-[480px] z-30 pb-safe">
        <div class="flex justify-around items-center h-16">
            <button onclick="switchTab('scan')" id="nav-scan" class="flex-1 flex flex-col items-center justify-center text-red-600 gap-1 transition">
                <i class="fa-solid fa-camera text-xl"></i>

</div>

    const productDatabase = [];
    
    // 解析資料
    rawDataString.trim().split('\n').forEach(line => {
        if(line.startsWith('|')) {
            const parts = line.split('|').map(p => p.trim()).filter(p => p);

    // 渲染完整清單
    function renderFullList() {
        const container = document.getElementById('full-list-container');
        container.innerHTML = '';
        
        productDatabase.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = "bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex flex-col";

    renderFullList();

    // DOM 元素
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('canvas-capture');
    const btnStartCamera = document.getElementById('btn-start-camera');
    const btnCapture = document.getElementById('btn-capture');
    const cameraStatus = document.getElementById('camera-status');
    const scanLine = document.getElementById('scan-line');
    const ocrStatus = document.getElementById('ocr-status');
    const ocrText = document.getElementById('ocr-text');
    const ocrLoader = document.getElementById('ocr-loader');
    
    let stream = null;
    let tesseractReady = false;
    let worker = null;

    // 初始化 Tesseract Worker
    async function initTesseract() {
        try {
            ocrStatus.classList.remove('hidden');
            worker = await Tesseract.createWorker('chi_tra'); // 繁體中文
            tesseractReady = true;
            ocrText.innerText = "文字辨識引擎已準備就緒";
            ocrLoader.classList.add('hidden');
            setTimeout(() => { ocrStatus.classList.add('hidden'); }, 2000);
            
            if(stream) {
                btnCapture.disabled = false;
            }
        } catch (error) {
            console.error("Tesseract 初始化失敗:", error);
            ocrText.innerText = "辨識引擎載入失敗，請使用手動搜尋";
            ocrLoader.classList.add('hidden');
        }
    }

    // 顯示相機錯誤訊息（含診斷細節），並保留「重試」按鈕
    function showCameraError(title, detail, allowRetry = true) {
        cameraStatus.innerHTML = `
            <i class="fa-solid fa-triangle-exclamation text-4xl mb-4 text-red-400"></i>
            <p class="mb-2 text-red-400 font-bold">${title}</p>
            <p class="text-sm text-gray-300 leading-relaxed mb-4">${detail}</p>
            ${allowRetry ? '<button id="btn-retry-camera" class="bg-red-500 hover:bg-red-600 px-6 py-2 rounded-full font-semibold transition shadow-lg">重試開啟相機</button>' : ''}
        `;
        const retryBtn = document.getElementById('btn-retry-camera');
        if (retryBtn) retryBtn.addEventListener('click', startCamera);
    }

    // 偵測常見 App 內建瀏覽器（這些 WebView 的 getUserMedia 常常無聲失敗）
    function detectInAppBrowser() {
        const ua = navigator.userAgent || '';
        const patterns = [
            [/Line\//i, 'LINE'],
            [/FBAN|FBAV|FB_IAB/i, 'Facebook / Messenger'],
            [/Instagram/i, 'Instagram'],
            [/MicroMessenger/i, 'WeChat 微信'],
            [/TikTok|musical_ly|Bytedance/i, 'TikTok'],
            [/Twitter/i, 'X (Twitter)'],
            [/GSA\//i, 'Google App'],
            [/KAKAOTALK/i, 'KakaoTalk'],
        ];
        for (const [re, name] of patterns) {
            if (re.test(ua)) return name;
        }
        return null;
    }

    // 頁面載入時先做環境檢測，直接告訴使用者原因
    (function checkCameraEnvironment() {
        // 1. 非安全上下文（http:// 或 file://）→ 瀏覽器根本不提供相機 API
        if (!window.isSecureContext) {
            showCameraError(
                "此網頁未透過 HTTPS 開啟",
                `目前網址為 <code class="text-yellow-300">${location.protocol}//${location.host || '(本機檔案)'}</code>。<br>
                 手機瀏覽器規定：相機功能只能在 <b>HTTPS 網址</b>下使用。<br>
                 請將此頁面部署到 HTTPS 網站（如 GitHub Pages）後再開啟，或改用下方「關鍵字查」功能。`,
                false
            );
            return;
        }
        // 2. App 內建瀏覽器：即使 API 存在也常常無聲失敗，直接提示改用標準瀏覽器
        const inApp = detectInAppBrowser();
        if (inApp) {
            showCameraError(
                `您正在 ${inApp} 的內建瀏覽器中`,
                `App 內建瀏覽器通常<b>無法使用相機</b>（點了不會有任何反應）。<br>
                 請點選右上角（或右下角）「⋯」選單 → 「<b>以瀏覽器開啟</b>」，改用 Safari 或 Chrome 開啟本頁。<br>
                 或直接複製網址貼到瀏覽器：<br>
                 <code class="text-yellow-300 text-xs break-all">${location.href}</code>`
            );
            return;
        }
        // 3. 舊瀏覽器不支援 mediaDevices
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showCameraError(
                "此瀏覽器不支援相機功能",
                `請改用 Safari（iPhone）或 Chrome（Android）開啟本頁，或改用「關鍵字查」功能。`,
                false
            );
            return;
        }
    })();

    // 開啟相機（具名函式，供重試按鈕重複呼叫）
    let useFallbackConstraint = false;
    async function startCamera() {
        // 再次防呆：API 不存在時給明確訊息，而非拋出難懂的 TypeError
        if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showCameraError(
                "無法啟用相機",
                "此環境不支援相機 API（需 HTTPS 且使用 Safari / Chrome 等標準瀏覽器）。請改用「關鍵字查」功能。",
                false
            );
            return;
        }
        try {
            const constraints = useFallbackConstraint
                ? { video: true } // 後備：不指定鏡頭方向
                : { video: { facingMode: 'environment' } };
            // 逾時保護：某些 App 內建瀏覽器的 getUserMedia 會永遠卡住、不跳權限視窗
            const timeout = new Promise((_, reject) =>
                setTimeout(() => reject(Object.assign(new Error('camera request timed out'), { name: 'CameraTimeoutError' })), 10000)
            );
            btnStartCamera.disabled = true;
            btnStartCamera.innerText = "啟動中…（請留意權限詢問視窗）";
            stream = await Promise.race([
                navigator.mediaDevices.getUserMedia(constraints),
                timeout
            ]);
            video.srcObject = stream;
            // iOS Safari 有時需要明確呼叫 play()
            try { await video.play(); } catch (e) { /* autoplay 屬性通常已足夠 */ }
            cameraStatus.classList.add('hidden');
            scanLine.style.display = 'block';
            
            if(tesseractReady) {
                btnCapture.disabled = false;
            } else if (!worker) {
                initTesseract();
            }
        } catch (err) {
            console.error("無法取得相機權限", err);
            let title = "無法存取相機";
            let detail = "請確認瀏覽器已允許相機權限，或切換至「關鍵字查」功能。";
            switch (err.name) {
                case "NotAllowedError":
                case "PermissionDeniedError":
                    title = "相機權限被拒絕";
                    detail = `請至手機「設定」中允許瀏覽器使用相機：<br>
                              <b>iPhone</b>：設定 → Safari（或 Chrome）→ 相機 → 允許<br>
                              <b>Android</b>：設定 → 應用程式 → Chrome → 權限 → 相機`;
                    break;
                case "NotFoundError":
                case "DevicesNotFoundError":
                    title = "找不到相機裝置";
                    detail = "此裝置沒有可用的鏡頭，請改用「關鍵字查」功能。";
                    break;
                case "NotReadableError":
                case "TrackStartError":
                    title = "相機被其他 App 占用";
                    detail = "請關閉其他正在使用相機的 App（如視訊會議、相機 App）後重試。";
                    break;
                case "OverconstrainedError":
                    title = "找不到後置鏡頭";
                    detail = "將改以任一可用鏡頭重試，請點「重試開啟相機」。";
                    useFallbackConstraint = true; // 下次重試不指定鏡頭方向
                    break;
                case "CameraTimeoutError":
                    title = "相機啟動逾時（未跳出權限詢問）";
                    detail = `這通常表示您在 <b>App 內建瀏覽器</b>中（如 LINE、Facebook、Gmail），它會攔截相機請求且不顯示任何訊息。<br>
                              請複製網址，改用 <b>Safari 或 Chrome</b> 開啟：<br>
                              <code class="text-yellow-300 text-xs break-all">${location.href}</code>`;
                    break;
                default:
                    detail += `<br><span class="text-xs text-gray-500">錯誤類型：${err.name || err.message}</span>`;
            }
            showCameraError(title, detail);
        } finally {
            btnStartCamera.disabled = false;
            btnStartCamera.innerText = "開啟相機";
        }
    }
    btnStartCamera.addEventListener('click', startCamera);

    // 關閉相機
    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
            stream = null;
            cameraStatus.classList.remove('hidden');
            scanLine.style.display = 'none';
            btnCapture.disabled = true;
        }
    }

    // 拍照並辨識
    btnCapture.addEventListener('click', async () => {
        if (!tesseractReady || !stream) return;

        btnCapture.disabled = true;
        scanLine.style.animation = 'scan 0.5s linear infinite'; // 加快掃描線
        ocrStatus.classList.remove('hidden');
        ocrLoader.classList.remove('hidden');
        ocrText.innerText = "正在分析影像內容...";

        // 畫布擷取影片畫面
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // 由於掃描框只占中間部分，我們可以裁切中央區域提高辨識效率 (為求穩定此處採全圖辨識，但依靠 Tesseract 強大能力)
        const imageData = canvas.toDataURL('image/jpeg', 0.8);

        try {
            const { data: { text } } = await worker.recognize(imageData);
            console.log("OCR Result:", text);
            analyzeText(text);
        } catch (err) {
            console.error("辨識失敗", err);
            showModal("辨識失敗", "無法辨識影像文字，請重試或手動輸入", "error");
        } finally {
            btnCapture.disabled = false;
            scanLine.style.animation = 'scan 2s linear infinite';
            ocrStatus.classList.add('hidden');
        }
    });

    // 分析文字並比對資料庫 (模糊搜尋)
    function analyzeText(scannedText) {
        if(!scannedText || scannedText.trim() === '') {
            showModal("未能辨識文字", "請確認畫面清晰、反光不嚴重，或改用手動搜尋。", "warning");
            return;
        }

        // 清理換行與空白
        const cleanText = scannedText.replace(/\s+/g, '').toLowerCase();
        
        const matches = [];
        // 關鍵字比對：只要產品名稱長度大於2的詞有出現在辨識文字中，就列為嫌疑
        productDatabase.forEach(item => {
            const safeName = item.name.replace(/\s+/g, '').toLowerCase();
            const safeCompany = item.company.replace(/\s+/g, '').toLowerCase();
            
            // 由於 OCR 會有錯字，我們採用部分包含的比對方式
            // 如果產品名稱有出現在辨識結果中，或辨識結果有出現在產品名稱中 (長度>2)
            if (
                (safeName.length > 2 && cleanText.includes(safeName)) || 
                (cleanText.length > 2 && safeName.includes(cleanText)) ||
                (safeCompany.length > 3 && cleanText.includes(safeCompany))
            ) {
                matches.push(item);
            }
        });

        if (matches.length > 0) {
            showModal("⚠️ 警告：疑似受影響產品", `系統從包裝上辨識出可能為預防性下架之清單產品，請仔細核對！<br><span class="text-xs text-gray-400 mt-2 block">辨識文字擷取：${scannedText.substring(0,20)}...</span>`, "danger", matches);
        } else {
            showModal("✅ 尚未發現異常", `從擷取的文字中，未在下架清單內找到相符項目。<br><span class="text-xs text-gray-400 mt-2 block">辨識文字擷取：${scannedText.substring(0,20)}...</span><br><span class="text-xs text-red-400">注意：AI 辨識可能不完美，建議再使用手動搜尋確認。</span>`, "success");
        }
    }

    // 手動搜尋邏輯
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const searchCount = document.getElementById('search-count');

    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.trim().toLowerCase();
        searchResults.innerHTML = '';
        
        if (keyword === '') {
            searchCount.innerText = "0";
            searchResults.innerHTML = `
                <div class="text-center text-gray-400 mt-10">
                    <i class="fa-solid fa-box-open text-4xl mb-2"></i>
                    <p>請輸入關鍵字開始查詢</p>
                </div>`;
            return;
        }

        const filtered = productDatabase.filter(item => 
            item.name.toLowerCase().includes(keyword) || 
            item.company.toLowerCase().includes(keyword)
        );

        searchCount.innerText = filtered.length;

        if (filtered.length === 0) {
            searchResults.innerHTML = `
                <div class="text-center text-green-500 mt-10">
                    <i class="fa-solid fa-circle-check text-5xl mb-2"></i>
                    <p class="font-bold text-lg mt-2">安全！未找到相關產品</p>
                    <p class="text-sm text-gray-500 mt-1">此關鍵字不在預防性下架清單中</p>
                </div>`;
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = "bg-red-50 border-l-4 border-red-500 p-3 rounded-r-lg shadow-sm";
            div.innerHTML = `
                <div class="text-xs text-red-400 mb-1"><i class="fa-solid fa-industry"></i> ${item.company}</div>
                <div class="font-bold text-red-700 text-lg">${item.name}</div>
                <div class="text-xs text-gray-600 mt-2 bg-white inline-block px-2 py-1 rounded">效期/狀態: ${item.expiry}</div>
            `;
            searchResults.appendChild(div);
        });
    });

    // Tab 切換邏輯
    function switchTab(tabId) {
        // 隱藏所有 tabs
        document.getElementById('tab-scan').classList.add('hidden');
        document.getElementById('tab-search').classList.add('hidden');
        document.getElementById('tab-list').classList.add('hidden');
        
        // 重置 Nav 樣式
        document.getElementById('nav-scan').className = "flex-1 flex flex-col items-center justify-center text-gray-400 gap-1 transition hover:text-red-500";
        document.getElementById('nav-search').className = "flex-1 flex flex-col items-center justify-center text-gray-400 gap-1 transition hover:text-red-500";
        document.getElementById('nav-list').className = "flex-1 flex flex-col items-center justify-center text-gray-400 gap-1 transition hover:text-red-500";

        // 顯示目標 tab 並啟用樣式
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        document.getElementById(`nav-${tabId}`).className = "flex-1 flex flex-col items-center justify-center text-red-600 gap-1 transition";

        // 如果離開掃描頁，關閉相機以節省資源
        if (tabId !== 'scan') {
            stopCamera();
        } else {
            // 切回掃描頁，且如果尚未啟動過相機，則提示
            if(cameraStatus.classList.contains('hidden') === false) {
                // 等待使用者點擊開啟
            }
        }
    }

    // Modal 控制
    const modal = document.getElementById('result-modal');
    const modalContent = document.getElementById('modal-content');
    const modalIcon = document.getElementById('modal-icon');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalMatches = document.getElementById('modal-matches');

    function showModal(title, desc, type, matches = []) {
        modalTitle.innerText = title;
        modalDesc.innerHTML = desc;
        modalMatches.innerHTML = '';
        
        if (type === 'danger') {
            modalIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-white"></i>';
            modalIcon.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-4 bg-red-500 animate-pulse";
            modalTitle.className = "text-2xl font-bold text-center mb-2 text-red-600";
            
            if(matches.length > 0) {
                modalMatches.classList.remove('hidden');
                matches.slice(0, 5).forEach(m => {
                    modalMatches.innerHTML += `
                        <div class="bg-red-50 p-2 rounded text-left border border-red-100">
                            <div class="text-[10px] text-gray-500">${m.company}</div>
                            <div class="text-sm font-bold text-red-700">${m.name}</div>
                        </div>
                    `;
                });
                if(matches.length > 5) {
                    modalMatches.innerHTML += `<div class="text-xs text-center text-gray-400 mt-1">...等共 ${matches.length} 筆符合</div>`;
                }
            } else {
                modalMatches.classList.add('hidden');
            }

        } else if (type === 'success') {
            modalIcon.innerHTML = '<i class="fa-solid fa-check text-white"></i>';
            modalIcon.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-4 bg-green-500";
            modalTitle.className = "text-2xl font-bold text-center mb-2 text-green-600";
            modalMatches.classList.add('hidden');
        } else {
            modalIcon.innerHTML = '<i class="fa-solid fa-circle-info text-white"></i>';
            modalIcon.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-4 bg-orange-400";
            modalTitle.className = "text-2xl font-bold text-center mb-2 text-orange-500";
            modalMatches.classList.add('hidden');
        }

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(() => {
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }, 10);
    }

    function closeModal() {
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }, 200);
    }

    // 提前啟動 Tesseract (可選，但為了加快第一次掃描速度先在背景載入)
    // initTesseract(); 
</script>
</body>
</html>
